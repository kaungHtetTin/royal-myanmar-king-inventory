name: Release Candidate

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: MySQL release verification
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: inventory
          MYSQL_ROOT_PASSWORD: release-test-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prelease-test-root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: local
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: inventory
      DB_USERNAME: root
      DB_PASSWORD: release-test-root
      SUPER_ADMIN_PASSWORD: release-test-password
      MYSQLDUMP_BINARY: mysqldump
      MYSQL_BINARY: mysql

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run static, unit, and build gates
        run: |
          composer quality
          npm run quality
          npm run build
          composer audit --locked
          npm audit --omit=dev --audit-level=high

      - name: Prepare realistic MySQL baseline
        run: |
          php artisan migrate:fresh --seed --force
          php artisan inventory:validate-rollout-data resources/import-templates
          php artisan inventory:readiness --json

      - name: Run MySQL transaction and recovery gates
        run: |
          php tests/mysql_inventory_concurrency.php
          php tests/mysql_phase4_concurrency.php
          php tests/mysql_phase5_concurrency.php
          php tests/mysql_phase6_concurrency.php
          php tests/mysql_phase6_reconciliation.php
          php tests/mysql_phase7_reporting.php
          php tests/mysql_phase8_performance.php
          php tests/mysql_phase8_backup_restore.php
